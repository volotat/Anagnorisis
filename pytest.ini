[pytest]
# Two suites, deliberately separate:
#
#   anagnorisis_core/tests  the engine, tested without the application. These must
#                           pass with no Flask, no database and no browser present
#                           — that is the same boundary the annotator container
#                           relies on.
#   tests                   the Flask application, and the few tests that sit on
#                           the seam between it and the engine.
#
# Run one or the other to find out which side a failure is on:
#   pytest anagnorisis_core/tests    engine only
#   pytest tests                     application only
testpaths = anagnorisis_core/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
