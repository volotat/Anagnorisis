<script type="text/javascript"src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<!-- PAGE MAIN CONTENT -->
<div class="container is-fluid columns is-centered py-6">
  <aside class="column is-2 menu">
  </aside>

  <div class="column">
    <!-- Search bar component mount point -->
    <div id="search_bar_container" class="mb-4"></div>

    <!-- Pagination and status on top-->
    <nav class="level mt-6">
      <nav class="pagination is-rounded level-left mb-0" role="navigation" aria-label="pagination">    
        <ul class="pagination-list">
          <li>
            <span class="pagination-ellipsis">&hellip;</span>
          </li>
        </ul>
      </nav>
      <div class="level-right">
        <p class="image-search-status">...</p>
      </div>
    </nav>

    <!-- Grid with previews of videos -->
    <div id="videos_files_grid_container">
    </div>

    <!-- Pagination and status on bottom-->
    <nav class="pagination is-rounded mt-6" role="navigation" aria-label="pagination">
      <nav class="pagination is-rounded level-left mb-0" role="navigation" aria-label="pagination">    
        <ul class="pagination-list">
          <li>
            <span class="pagination-ellipsis">&hellip;</span>
          </li>
        </ul>
      </nav>
      <div class="level-right">
        <p class="image-search-status">...</p>
      </div>
    </nav>
  </div>

  <!-- Modal container -->
  <div class="modal" id="video-modal">
    <div class="modal-background"></div>
    
    <style>
      /* Previous / next: invisible until the pointer comes to that side of the
         video. They stop above the bottom so the video's own controls stay free. */
      #video-modal .video-nav {
        position: absolute;
        top: 0;
        bottom: 4rem;
        width: 12%;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        color: #fff;
        cursor: pointer;
        opacity: 0;
        transition: opacity .2s;
      }
      #video-modal .video-nav.is-prev { left: 0; }
      #video-modal .video-nav.is-next { right: 0; }
      #video-modal .video-nav:hover,
      #video-modal .video-nav:focus-visible { opacity: 1; }
      #video-modal .video-nav[disabled] { visibility: hidden; }
      #video-modal .video-nav span {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 5rem;
        height: 5rem;
        border-radius: 50%;
        background: rgba(0, 0, 0, .5);
        font-size: 2.5rem;
      }
      /* A touch screen has no hover to reveal them, so they stay faintly visible. */
      @media (hover: none) {
        #video-modal .video-nav { opacity: .5; }
      }
      /* The rating of the playing video, centred at the bottom of the screen. */
      #video_modal_rating {
        position: fixed;
        left: 50%;
        bottom: 1rem;
        transform: translateX(-50%);
        z-index: 41;
        white-space: nowrap;
      }
      /* Only the stars are centred: the "no rating" dot in front of them hangs
         off to their left. */
      #video_modal_rating > span { position: relative; }
      #video_modal_rating > span > span:first-child {
        position: absolute;
        right: 100%;
        margin-right: .25rem;
      }
    </style>

    <!-- Modal content that takes up most of the screen. The height leaves 3.5rem
         above and below the 16:9 video, which is where the rating sits. -->
    <div class="modal-content" style="width: min(95vw, calc((100vh - 7rem) * 16 / 9)); max-height: 95vh; margin: 0 auto; display: flex; align-items: center; justify-content: center;">
      <!-- Video container with responsive sizing -->
      <figure class="image is-16by9" style="width: 100%; max-height: 100%;">
        <video
          id="modal-video-player"
          class="has-ratio"
          controls
          preload="metadata"
          playsinline>
          <source src="" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <button class="video-nav is-prev" id="video_prev_btn" title="Previous video" aria-label="Previous video">
          <span><i class="fas fa-chevron-left"></i></span>
        </button>
        <button class="video-nav is-next" id="video_next_btn" title="Next video" aria-label="Next video">
          <span><i class="fas fa-chevron-right"></i></span>
        </button>
      </figure>
    </div>

    <div id="video_modal_rating"></div>

    <!--<div id="loading-indicator" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(0,0,0,0.7); color:white; padding:10px; border-radius:5px; z-index:10;">
      Loading video...
    </div>-->
    
    <!-- Close button -->
    <button class="modal-close is-large" aria-label="close"></button>
  </div>
