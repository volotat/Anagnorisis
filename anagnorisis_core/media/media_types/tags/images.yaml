# Zero-shot tag vocabulary for the "images" media type.
#
# Used by the embedding proxy: each tag is embedded once with the media type's
# embedding model, and the tags closest to a file's embedding are written into
# its metadata description. That gives files a searchable, ratable text
# representation before the (much slower) OmniDescriptor pass reaches them.
#
# Rows are written as "- [a, b, c]" purely for compactness — the loader
# flattens them into one flat list of tags.
#
# Extend freely. Changing the vocabulary changes its hash, which invalidates
# every cached proxy section and, through it, every metadata embedding that
# contained one — correct, but it means a full background re-index. Prefer
# batching edits over trickling them in.

