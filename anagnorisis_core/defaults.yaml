# Defaults for anagnorisis-core, used when nothing overrides them.
#
# The package has to work on its own: installed from a wheel, with no Anagnorisis
# checkout anywhere on the machine and no config.yaml to point at. So the two
# settings the engine cannot run without — which embedder, which descriptor — and
# the generation parameters they were tuned with live here, in the package.
#
# Everything here is a default in the ordinary sense. A file passed with --config
# is merged on top, key by key, so overriding one value does not mean restating
# the rest. The application's own config.yaml carries the same sections and
# therefore keeps winning when the app loads the engine.
#
# DO NOT edit this file to configure a machine. It is distribution content: it
# lives inside the installed package, so `pip install -U` overwrites it, and
# anything you put here ships to whoever installs the wheel next. Use
#
#     anag config set project_config_path /where/you/want/it
#
# which writes ~/.config/anagnorisis/config.yaml — outside the package, yours,
# and merged over this file.

main:
  # One folder holds everything this produces about your library, laid out the
  # same way the application lays out its project_config/ — so the two are
  # interchangeable. Point this at an application checkout's project_config and
  # the command line reads and writes exactly what the app does:
  #
  #     <project_config>/cache/     derived, disposable, rebuilt on demand
  #     <project_config>/memory/    your ratings; the one thing here that cannot
  #                                 be regenerated, because the file a memory
  #                                 describes may since have been deleted
  #     <project_config>/models/    the evaluator trained on those ratings
  #
  # Those three are derived from this path. Set any of cache_path, memory_path or
  # personal_models_path explicitly and that wins instead.
  project_config_path: ~/.local/share/anagnorisis/project_config

  # Kept out of the folder above on purpose. These are the downloaded weights —
  # gigabytes, identical for everyone, and worth pointing several users or
  # several checkouts at one copy rather than duplicating them on disk.
  embedding_models_path: ~/.local/share/anagnorisis/models

embedder: # The single model that embeds everything — text, images, audio and video.
  # One multimodal model means one vector space: a text query can rank a photo,
  # a song and a .meta description against each other in the same list.
  model_name: "jinaai/jina-embeddings-v5-omni-small"
  task: retrieval # retrieval | classification | clustering | text-matching
  embedding_dimension: 1024 # Matryoshka truncation: 32/64/128/256/512/768/1024
  chunk_size: null # Max tokens per chunk; null = the model's full context window,
                   # so a whole document becomes ONE contextual vector and only
                   # text that exceeds the window is split at all.
  chunk_overlap: 512 # Token overlap between chunks, when splitting is needed
  batch_size: 8 # Files embedded per forward pass
  # Searching never touches the GPU: queries are embedded on the CPU, in-process.
  # "omni" loads every tower so you can search WITH a file — drop in an image,
  # clip or track and find things like it. "text" loads only the text tower
  # (a third of the weights) if RAM is tight; text queries still work, searching
  # by a media file does not.
  query_modality: omni
  # Video is sampled to frames before encoding — handing the model a path makes
  # it decode the entire file into memory first, which OOMs on small clips.
  video_frames: 16 # Evenly spaced frames per video (the model accepts up to 32)
  # Longest side, in pixels, that any image or video frame is reduced to before
  # the model sees it. The processor is capped to match, so nothing is scaled
  # back up: left to itself it enforces a *minimum* of 512 square and would
  # enlarge a 512x288 frame to about 672x384, undoing the downscale and paying
  # for the extra visual tokens. Part of the embedder's fingerprint, since it
  # changes the vector.
  video_frame_max_size: 512
  # The model truncates audio at 30s regardless (Whisper's window), so decoding
  # more than this is pure waste. Raising it changes nothing but the cost.
  audio_seconds: 30
  idle_timeout_seconds: 120 # Unload the model after this long without use, to free VRAM
omni: # The descriptor: writes the natural-language description of a file.
  # That description is what metadata search indexes, what the evaluator rates
  # from, and the only thing remote servers publish about a file — so it is the
  # one representation shared between machines running different models.
  model_name: "google/gemma-4-E2B-it"
  load_in_4bit: true # 4-bit NF4: ~6.7 GB of VRAM, peaking near 6.9 GB while it
                     # writes. Unquantized needs 11 GB and will not fit an 8 GB card.
  cpu_offload_embeddings: false # Escape hatch for cards under ~8 GB: moves the
                     # big embedding table into system RAM, cutting VRAM to
                     # ~2.2 GB. Measured ~20x slower (6s -> 125s per
                     # description), because the table is read once per token.
  # Text shorter than this is used as it stands rather than summarised — it is
  # already its own best description, and compressing it would spend a model run
  # to produce something less informative. Applies wherever text arrives: a rated
  # paragraph, a rated .txt, and the scoring of either, so what the model is
  # taught and what it is asked about always match.
  text_verbatim_max_chars: 4000
  max_new_tokens: 256
  # Budget for the per-window descriptions of a long audio or video file, which
  # are intermediate: three of them are written, then folded into one final
  # description by a fourth pass that gets the full max_new_tokens above. Only
  # that final pass is stored and searched. Generation is essentially the whole
  # cost of describing (measured 16-22 tokens/s across every media type), so
  # 3x256+256 against 3x96+256 is the difference between 873 and 560 hours per
  # 100k files. The window text was already being truncated to 1024 characters
  # before the fold, so most of what the longer budget bought was discarded.
  segment_max_new_tokens: 96
  do_sample: false
  temperature: 0.2
  # Stills shown to the descriptor per sampled window. Measured on an 8 GB card,
  # alongside a full audio window: 4 peaks at 7.47 GB, 6 at 7.76 GB with about
  # 20 MB spare and no better description, 8 runs out of memory. Four leaves
  # enough headroom that a background pass survives something else touching the
  # card. Raise it on a larger card.
  video_frames_per_window: 4
  video_sample_max_size: 512 # Max dimension (width or height) for video frame sampling to the omni descriptor
  image_max_size: 512 # Max dimension (width or height) for input images to the omni descriptor
  min_free_vram_to_run: 7168 # Refuse to load with less than this much free VRAM,
                     # in MB. Measured peak is 6842 MB, so on an 8 GB card this
                     # effectively means "only when nothing else is resident" —
                     # correct, since the descriptor and the embedder cannot
                     # share the card. A background pass that is refused simply
                     # retries on its next tick, which is far cheaper than an
                     # out-of-memory abort halfway through a batch.
  image_prompt: "Describe this image in detail. Include objects, scene, colors, actions, and any text visible."
  audio_prompt: "Describe the audio in detail. Include instruments, genre, mood, tempo, and any notable features."
  video_prompt: "Describe the video in detail. Include the scene, actions, objects, and any notable events."
  text_prompt: "Provide a detailed summary of the following text:"
